# Golden set de Asunvic Bot
# ─────────────────────────────────────────────────────────────────────
# Casos de referencia con el comportamiento esperado del agente.
# Se evalúan con evals/correr_evals.py (DeepEval + chequeos deterministas).
#
# VERSIONADO: sube `version` cada vez que cambies casos (semver):
#   - patch (1.0.x): corriges la redacción de un caso
#   - minor (1.x.0): agregas casos
#   - major (x.0.0): cambias el comportamiento esperado (p. ej. nueva política)
# El reporte guarda la versión, así cada resultado es comparable con su set.
#
# CAMPOS DE CADA CASO
#   id            único: F=feliz, K=comparación, D=difuntos, B=borde, A=adversarial, O=fuera de alcance
#   categoria     feliz | comparacion | borde | adversarial | fuera_de_alcance
#   servicio      coro | instrumentos | agrupacion | general
#   criticidad    critica (bloquea el release si falla) | alta | media
#   contexto      (opcional) turnos previos fijos: [{cliente: ...}, {bot: ...}]
#   mensaje       lo que escribe el cliente
#   esperado      comportamiento esperado (lo lee el juez LLM)
#   escalar       true/false: si debe marcar [HUMANO]; null = no se verifica
#   debe_contener / no_debe_contener   regex (sin distinguir mayúsculas)
#   orden         (opcional) pares [A, B]: si aparece B, A debe aparecer antes
#   escenario     (opcional) cambio_de_prompt: el contexto (solo turnos de cliente)
#                 se genera EN VIVO con otra versión del prompt y pasa por SQLite
#   metricas      criterios G-Eval a aplicar (ver evals/metricas.py)
#   relevancia    true: también se mide Answer Relevancy
#   nota          (opcional) por qué el caso es así
#
# Fuente de verdad: conocimiento/coro.md, agrupacion.md e instrumentos.md (24-nov-2026, tarde).
#
# HISTORIAL
#   2.1.0  (25-nov-2026) + B10, regresión permanente del error de producción
#          "Invalid signature in thinking block" al cambiar el prompt (minor:
#          agrega un caso, no cambia el comportamiento esperado de los demás).
#          Nuevo campo `escenario: cambio_de_prompt`.
#   2.0.0  (24-nov-2026, tras la corrida 1: evals/resultados/2026-11-24_172230.json)
#          Sube a major porque cambia el comportamiento esperado (regla de este archivo).
#          + A05 = RT08 del red teaming, permanente (fuga de la etiqueta interna).
#          + Regla global en correr_evals.py: falla si el modelo escribe [HUMANO]
#            fuera de lugar (etiquetas descartadas por agente.py).
#          A01: regex con lookbehind (falso positivo con "si … quedó separado") y
#            + 'gracias por su pago'. B05: + 'gracias por tu pago'.
#          F02, F03, F05, B01: sin la métrica aviso_devoluciones_antes_de_pago
#            (retirada: el juez no aplica bien el "no corresponde"; ya la cubre el
#            chequeo determinista de orden aviso → Yape).
#          Todos los casos con relevancia: Answer Relevancy → responde_la_pregunta
#            (Answer Relevancy castiga los argumentos de venta que la política pide).
#          Métricas: no_inventa_datos recibe el conocimiento; empatia_sin_presion no
#            exige repetir el pésame. Detalle y evidencia en evals/metricas.py.
#          NINGÚN umbral se bajó.
#   1.1.0  Nuevos precios del coro (S/ 100 / 200 / 300). Nueva política: el agente
#          vende con argumentos y responde comparaciones sin escalar; solo escala
#          para cotizar sin precio, fechas, pagos, descuentos o quejas.
#          + 6 casos de comparación (K01–K06) y 1 de difuntos (D01).
#          B06 ya no escala. O03 pasa a B09 (la agrupación ya está en alcance).
#          F02 exige NO escalar (en quenas solo se escala al recibir la captura).
#   1.0.0  Versión inicial (22 casos).

